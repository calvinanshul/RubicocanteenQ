# Render Blueprint for CanteenQ: one Next.js web service (pages + /api route handlers) and Postgres.
# Create it in the Render dashboard: New → Blueprint → pick the GitHub repo. See docs/deploy-render.md.
#
# Free plan notes:
# - The web service sleeps after 15 min without traffic; the first request then takes ~30-60 s.
# - The free database EXPIRES 30 days after it is created and is deleted 14 days later unless upgraded.
# - Free services have no shell and no pre-deploy step, so migrations and the production seed run in the
#   start command. Both are safe to repeat on every start.

databases:
  - name: rubicocanteenq-db
    plan: free
    region: singapore
    databaseName: canteenq
    user: canteenq
    postgresMajorVersion: "16"
    # Empty list = no connections from outside Render. Add your IP in the dashboard to use DBeaver.
    ipAllowList: []

services:
  - type: web
    name: rubicocanteenq
    runtime: node
    plan: free
    region: singapore
    # --include=dev: Render sets NODE_ENV=production, which would otherwise skip devDependencies.
    # The build needs prisma, and the start command needs tsx for the production seed.
    buildCommand: npm ci --include=dev && npm run build
    # `next start` listens on $PORT (set by Render)
    startCommand: npm run db:deploy && npm run db:seed:prod && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_ENV
        value: production
      - key: ENABLE_TEST_CLOCK
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: rubicocanteenq-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: rubicocanteenq-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # Bearer token for the auto no-show job (POST /api/cron/no-show)
      - key: CRON_SECRET
        generateValue: true
      - key: ALLOWED_EMAIL_DOMAINS
        value: rubicotech.com,rubicotech.in
      # Asked for when the Blueprint is created; never stored in git
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Administrator
      # Welcome email on sign-up. ethereal = fake inbox (nothing is delivered; each email's preview link is in the log).
      # Switch to smtp and add SMTP_HOST/SMTP_PORT/SMTP_USER/SMTP_PASS for real delivery.
      - key: MAIL_TRANSPORT
        value: ethereal
      - key: MAIL_FROM
        value: CanteenQ <no-reply@canteenq.local>
      # Ethereal login (https://ethereal.email). Set both so the account survives restarts; asked for at Blueprint creation.
      - key: ETHEREAL_USER
        sync: false
      - key: ETHEREAL_PASS
        sync: false
