name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: canteen_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: 'true'
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/canteen_test
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/canteen_e2e
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/canteen_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/canteen_test
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: PGPASSWORD=postgres createdb -h localhost -U postgres canteen_e2e
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:api
      - run: npx playwright install --with-deps chromium
      # Builds the app and runs it with `next start` (see playwright.config.ts)
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: playwright-report }
