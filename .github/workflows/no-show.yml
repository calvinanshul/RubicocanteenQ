# ST-17 / US-20: mark overdue orders NO_SHOW (X2). Runs every 15 minutes across the pickup
# window and the no-show grace period: 12:30–16:15 IST = 07:00–10:45 UTC, Monday to Friday.
# Repository secrets: API_URL (e.g. https://<project>.vercel.app, the Vercel deployment) and CRON_SECRET (same value as the API's).
name: no-show
on:
  schedule:
    - cron: '*/15 7-10 * * 1-5'
  workflow_dispatch:
jobs:
  mark-no-shows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call POST /api/cron/no-show
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "API_URL or CRON_SECRET is not set; skipping."
            exit 0
          fi
          # Allow time for a cold start, retry once
          curl --fail-with-body --silent --show-error --max-time 90 --retry 1 --retry-delay 20 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" "$API_URL/api/cron/no-show"
